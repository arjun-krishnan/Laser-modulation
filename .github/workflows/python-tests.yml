name: Automated Tests

on: 
  push:
    branches: [ main, refactor-structure ]
  pull_request:
    branches: [ main ]
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Grab your code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4
      
    # 2. Install a fresh version of Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    # 3. Install your package and pytest
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    # 4. Run the exact command you just ran on your laptop!
    - name: Run Pytest
      run: |
        pytest